<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Para Mateo</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
        }

        .card {
            width: 360px;
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            text-align: center;
        }

        .card h1 {
            margin-bottom: 10px;
            font-size: 26px;
        }

        .city-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 15px;
            margin-bottom: 12px;
        }

        .arrow {
            font-size: 30px;
            margin: 10px 0;
        }

        .footer {
            margin-top: 12px;
            font-size: 14px;
            color: #444;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>Para Mateo</h1>

        <!-- Imagen Bogotá (placeholder visible) -->
        <img class="city-image" 
             src="https://picsum.photos/800/500?random=1" 
             alt="Bogotá">

        <div class="arrow">⬇️</div>

        <!-- Imagen Medellín (placeholder visible) -->
        <img class="city-image" 
             src="https://picsum.photos/800/500?random=2" 
             alt="Medellín">

        <div class="footer">Bogotá ➜ Medellín</div>
    </div>
</body>
</html>
