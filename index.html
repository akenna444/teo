<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>De Zipa a Medellín 💗✈️</title>

    <style>
        body {
            background: #fde6ef;
            font-family: "Poppins", sans-serif;
            margin: 0;
            overflow: hidden;
        }

        .contenedor {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        .city {
            width: 170px;
            position: absolute;
        }

        #zipa {
            left: 10%;
            bottom: 15%;
        }

        #mede {
            right: 10%;
            top: 15%;
        }

        .avion {
            width: 70px;
            position: absolute;
            animation: volar 6s infinite ease-in-out;
        }

        @keyframes volar {
            0% { left: 10%; bottom: 15%; }
            50% { left: 45%; top: 10%; }
            100% { left: 80%; top: 15%; }
        }

        .frase {
            position: absolute;
            bottom: 30px;
            width: 100%;
            text-align: center;
            font-size: 22px;
            font-weight: 600;
            color: #b43d72;
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <!-- Zipaquirá -->
        <img id="zipa" class="city" src="https://upload.wikimedia.org/wikipedia/commons/5/55/Colombia_-_Cundinamarca.svg">

        <!-- Medellín -->
        <img id="mede" class="city" src="https://upload.wikimedia.org/wikipedia/commons/4/43/Antioquia_in_Colombia_%28departments%29.svg">

        <!-- Avioncito -->
        <img class="avion" src="https://upload.wikimedia.org/wikipedia/commons/5/5f/Paper_plane_icon.svg">

        <!-- Frase final -->
        <div class="frase">
            Desde Zipaquirá hasta Medellín… siempre voy hacia ti 💗✈️
        </div>

    </div>

</body>
</html>
