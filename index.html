<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Mateo</title>

    <style>
        body {
            background: #fff;
            font-family: "Comic Sans MS", cursive;
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .mapa {
            position: relative;
            width: 90%;
            max-width: 500px;
            margin: 0 auto;
        }

        img {
            position: absolute;
        }

        #bogota {
            width: 150px;
            left: 10px;
            top: 150px;
        }

        #medellin {
            width: 130px;
            right: 10px;
            top: 140px;
        }

        #plane {
            width: 90px;
            top: 40px;
            left: 45%;
            animation: volar 4s ease-in-out forwards;
        }

        @keyframes volar {
            0% { transform: translate(0,0); }
            30% { transform: translate(-40px, 80px); }
            60% { transform: translate(40px, 160px); }
            85% { transform: translate(-20px, 200px); }
            100% { transform: translate(90px, 240px); }
        }

        #mensajeFinal {
            opacity: 0;
            font-size: 20px;
            margin-top: 330px;
            transition: opacity 1s ease;
        }
    </style>
</head>

<body>

    <h1>Para Mateo 💙</h1>
    <p>Always together, never apart...</p>

    <div class="mapa">
        <!-- Bogotá -->
        <img id="bogota" src="https://raw.githubusercontent.com/akenna444/teo/main/bogota.png">

        <!-- Medellín -->
        <img id="medellin" src="https://raw.githubusercontent.com/akenna444/teo/main/medellin.png">

        <!-- Avioncito -->
        <img id="plane" src="https://raw.githubusercontent.com/akenna444/teo/main/plane.png">
    </div>

    <p id="mensajeFinal">Maybe in distance but never in ❤️</p>

    <script>
        setTimeout(() => {
            document.getElementById("mensajeFinal").style.opacity = 1;
        }, 4000);
    </script>

</body>
</html>
